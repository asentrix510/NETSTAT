    position: relative
    }
.brushed-metal::before {
    content: "";
    position: absolute;
    top: 0;
    left: 0;
    right: 0;

    }

.led-glow-primary {

.led-glow-tertiary {

    }
.lcd-recess {
    box-shadow: inset 2px 2px 4px rgba(0, 0, 0, 0.9)
    }
@keyframes scanline {
    0% {
        transform: translateY(-100%);
        } 100% {
        transform: translateY(100%);
        }
    }
.scanline-effect::after {
    content: "";
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 2px;
    background: rgba(0, 218, 243, 0.1);
