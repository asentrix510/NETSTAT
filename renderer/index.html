<!DOCTYPE html>
<html class="dark" lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Precision Monitor</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<script id="tailwind-config">
tailwind.config = {
  darkMode: "class",
  theme: {
    extend: {
      "colors": {
        "on-secondary-fixed-variant": "#624000", "primary-container": "#00363d", "tertiary-container": "#003918", 
        "on-tertiary-fixed-variant": "#005226", "outline-variant": "#43474a", "on-error": "#690005", "on-tertiary": "#003918", 
        "on-primary-container": "#00a7bb", "surface-dim": "#131313", "on-primary-fixed": "#001f24", "inverse-surface": "#e5e2e1", 
        "on-tertiary-container": "#00af58", "tertiary-fixed": "#62ff96", "tertiary": "#00e475", "surface-container-highest": "#353534", 
        "on-surface": "#e5e2e1", "surface-container": "#201f1f", "tertiary-fixed-dim": "#00e475", "outline": "#8d9194", 
        "on-tertiary-fixed": "#00210b", "error-container": "#93000a", "primary": "#00daf3", "on-background": "#e5e2e1", 
        "on-primary-fixed-variant": "#004f58", "inverse-primary": "#006875", "inverse-on-surface": "#313030", "secondary": "#ffcf8f", 
        "on-primary": "#00363d", "surface-tint": "#00daf3", "surface-variant": "#353534", "on-secondary-container": "#684300", 
        "surface-container-low": "#1c1b1b", "on-secondary": "#452b00", "surface-bright": "#393939", "background": "#131313", 
        "primary-fixed": "#9cf0ff", "primary-fixed-dim": "#00daf3", "on-secondary-fixed": "#291800", "secondary-fixed-dim": "#ffb950", 
        "on-surface-variant": "#c3c7ca", "error": "#ffb4ab", "secondary-fixed": "#ffddb3", "on-error-container": "#ffdad6", 
        "secondary-container": "#feaa00", "surface-container-lowest": "#0e0e0e", "surface": "#131313", "surface-container-high": "#2a2a2a"
      },
      "fontFamily": {
        "headline": ["Space Grotesk"],
        "body": ["Inter"],
        "label": ["Space Grotesk"]
      }
    }
  }
}
</script>
<link rel="stylesheet" href="styles.css">
</head>
<body class="bg-transparent w-full h-full m-0 p-0 overflow-hidden font-body text-on-surface">

<div class="fixed right-0 top-0 bottom-0 z-50 flex items-center h-full">
  <!-- POP-OUT CONSOLE PANEL -->
  <div id="dashboard" class="flex items-center hidden transition-opacity duration-200">
    <div class="w-[300px] h-[480px] brushed-metal rounded-l-xl p-4 flex flex-col gap-4 shadow-[-20px_0_40px_rgba(0,0,0,0.6)] border-y-2 border-l-2 border-surface-bright">
      <!-- Top Header -->
      <div class="flex justify-between items-center px-1">
        <div class="flex flex-col">
          <span class="font-headline font-black text-[10px] tracking-widest text-outline uppercase">Precision Monitor</span>
          <span class="font-headline font-bold text-primary text-xs flex items-center gap-1">
            <span class="w-1.5 h-1.5 rounded-full bg-tertiary led-glow-tertiary"></span>
            ACTIVE NODE: AERO-5G
          </span>
        </div>
        <div class="flex gap-2">
          <button class="milled-edge bg-surface-container-high w-6 h-6 flex items-center justify-center rounded-sm hover:bg-surface-bright transition-colors">
            <span class="material-symbols-outlined text-[14px] text-outline">settings</span>
          </button>
          <button class="milled-edge bg-surface-container-high w-6 h-6 flex items-center justify-center rounded-sm hover:bg-surface-bright transition-colors" id="close-btn">
            <span class="material-symbols-outlined text-[14px] text-outline">power_settings_new</span>
          </button>
        </div>
      </div>
      
      <!-- GAUGES SECTION -->
      <div class="grid grid-cols-5 gap-3 h-40">
        <!-- Main Download Gauge -->
        <div class="col-span-3 h-full gauge-well bg-surface-container-lowest rounded-lg relative overflow-hidden flex flex-col items-center justify-center">
          <div class="absolute inset-0 glass-overlay pointer-events-none"></div>
          <div class="absolute inset-0 flex items-center justify-center opacity-20">
            <div class="w-28 h-28 border-4 border-dashed border-on-surface rounded-full"></div>
          </div>
          <div class="relative w-24 h-24 flex items-center justify-center">
            <div id="dl-needle" class="absolute w-1 h-12 bg-primary origin-bottom -rotate-12 mb-12 rounded-full drop-shadow-[0_0_5px_#00daf3]"></div>
            <div class="w-4 h-4 rounded-full bg-surface-bright border-2 border-primary-container z-10"></div>
          </div>
          <div class="mt-2 text-center z-20">
            <div id="dl-text" class="font-headline text-3xl font-bold tracking-tighter text-on-surface">0.0</div>
            <div class="font-headline text-[10px] tracking-widest text-primary uppercase font-bold">Mbps Download</div>
          </div>
        </div>
        
        <!-- Upload Gauge & Ping -->
        <div class="col-span-2 h-full flex flex-col gap-2">
          <div class="h-1/2 gauge-well bg-surface-container-lowest rounded-lg relative overflow-hidden flex flex-col items-center justify-center">
            <div class="absolute inset-0 glass-overlay pointer-events-none"></div>
            <div id="ul-needle" class="absolute w-0.5 h-6 bg-secondary origin-bottom rotate-45 mb-6 rounded-full drop-shadow-[0_0_4px_#ffcf8f]"></div>
            <div class="mt-4 text-center z-10">
              <div id="ul-text" class="font-headline text-lg font-bold text-on-surface">0.0</div>
              <div class="font-headline text-[8px] text-secondary uppercase font-bold">Upload</div>
            </div>
          </div>
          <div class="h-1/2 lcd-recess bg-surface-container-lowest rounded-lg p-2 flex flex-col items-center justify-center">
            <div id="ping-text" class="font-headline text-xl font-bold text-tertiary">0<span class="text-[10px] ml-1 text-outline">ms</span></div>
            <div class="font-headline text-[8px] text-outline uppercase font-bold">Latency</div>
          </div>
        </div>
      </div>
      
      <!-- NETWORK INFO BENTO -->
      <div class="grid grid-cols-2 gap-2">
        <div class="lcd-recess bg-stone-950 p-2 rounded border-l-2 border-primary/30">
          <div class="text-[8px] text-outline font-bold uppercase mb-1">Service Type</div>
          <div id="net-type" class="text-[10px] font-mono text-on-surface">DETECTING...</div>
        </div>
        <div class="lcd-recess bg-stone-950 p-2 rounded border-l-2 border-tertiary/30">
          <div class="text-[8px] text-outline font-bold uppercase mb-1">Status</div>
          <div id="net-status" class="text-[10px] font-mono text-tertiary">MONITORING</div>
        </div>
      </div>
      
      <!-- OSCILLOSCOPE GRAPH -->
      <div class="flex-grow lcd-recess bg-black rounded-lg relative overflow-hidden scanline-effect border border-surface-container-highest">
        <div class="absolute inset-0" style="background-image: linear-gradient(#111 1px, transparent 1px), linear-gradient(90deg, #111 1px, transparent 1px); background-size: 20px 20px;"></div>
        <!-- Note: We'll replace this SVG with Chart.js canvas in Stage 4 -->
        <canvas id="speed-chart" class="absolute inset-0 w-full h-full opacity-80 z-10"></canvas>
        <div class="absolute bottom-1 right-2 flex gap-3 z-20">
          <div class="flex items-center gap-1">
            <div class="w-1.5 h-1.5 bg-primary"></div>
            <span class="text-[8px] font-mono text-primary opacity-70 uppercase">DL</span>
          </div>
          <div class="flex items-center gap-1">
            <div class="w-1.5 h-1.5 bg-secondary"></div>
            <span class="text-[8px] font-mono text-secondary opacity-70 uppercase">UL</span>
          </div>
        </div>
      </div>
      
      <!-- Footer -->
      <div class="flex justify-between items-center text-[9px] font-mono text-outline/50 uppercase px-1">
        <span>Unit-ID: PR-X01</span>
        <span>Uptime: <span id="uptime">00:00:00</span></span>
      </div>
    </div>
  </div>

  <!-- THE METALLIC HANDLE -->
  <div id="sidebar-handle" class="w-[12px] h-full bg-stone-900 border-l border-surface-bright flex flex-col items-center py-10 gap-8 shadow-[-4px_0_12px_rgba(0,0,0,0.5)] z-50 cursor-pointer hover:bg-[#1a1a1a] transition-colors">
    <div class="flex flex-col gap-4">
      <div class="w-1.5 h-1.5 rounded-full bg-tertiary/20 border border-tertiary/30"></div>
      <div class="w-1.5 h-1.5 rounded-full bg-primary led-glow-primary"></div>
      <div class="w-1.5 h-1.5 rounded-full bg-primary/20 border border-primary/30"></div>
      <div class="w-1.5 h-1.5 rounded-full bg-primary led-glow-primary"></div>
    </div>
    
    <div class="flex flex-col gap-6 mt-auto mb-10">
      <span class="material-symbols-outlined text-[10px] text-primary rotate-90">sensors</span>
      <span class="material-symbols-outlined text-[10px] text-tertiary rotate-90">lan</span>
      <span class="material-symbols-outlined text-[10px] text-secondary rotate-90">warning</span>
    </div>
    
    <div class="flex-grow w-full opacity-10 flex flex-col items-center gap-1">
      <div class="w-full h-[1px] bg-white"></div>
      <div class="w-full h-[1px] bg-white"></div>
      <div class="w-full h-[1px] bg-white"></div>
      <div class="w-full h-[1px] bg-white"></div>
    </div>
  </div>
</div>

<script src="ui.js"></script>
</body>
</html>
