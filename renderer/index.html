<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Network Monitor</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="styles.css">
</head>
<body class="bg-transparent m-0 p-0 overflow-hidden text-[#ececec] font-[Inter] select-none flex items-center justify-end w-[100vw] h-[100vh]">
  
  <div class="flex flex-row items-center justify-end pr-0.5">
    
    <!-- Clean, refined Dashboard -->
    <div id="dashboard" class="hidden w-[310px] h-[340px] bg-[#111111]/95 backdrop-blur-3xl border border-white/10 rounded-2xl shadow-[-10px_0_30px_rgba(0,0,0,0.5)] flex-col p-6 transition-opacity duration-200 mr-2">
        
        <!-- Header -->
        <div class="flex items-center justify-between mb-5">
             <div class="flex flex-col gap-1 w-3/5">
                 <h1 id="network-name" class="text-sm font-semibold text-white tracking-tight truncate">Connecting...</h1>
                 <p class="text-[10px] text-[#888888] flex items-center gap-1.5 font-medium">
                    <span class="w-1.5 h-1.5 rounded-full bg-emerald-500"></span> Live Connection
                 </p>
             </div>
             <div class="flex items-center gap-2">
                 <!-- Unit Toggle Button -->
                 <button id="unit-toggle-btn" class="px-2 py-1 bg-white/5 hover:bg-white/10 border border-white/5 rounded-md text-[9px] font-medium text-[#cccccc] transition-colors cursor-pointer">
                     Mb/s
                 </button>
                 <!-- Close Button -->
                 <button id="close-btn" class="w-6 h-6 rounded-md hover:bg-[#ff4444]/20 hover:text-[#ff4444] transition-colors flex items-center justify-center text-[#888] cursor-pointer">
                     <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg>
                 </button>
             </div>
        </div>

        <!-- Metric Speed grid -->
        <div class="flex gap-4 mb-6">
            <div class="flex-1">
                <p class="text-[11px] text-[#888] font-medium mb-1 flex items-center gap-1.5">
                    <svg class="w-3 h-3 text-blue-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8M16 6l-4-4-4 4M12 2v13"/></svg>
                    Download
                </p>
                <div class="flex items-baseline gap-1 mt-1">
                    <span id="dl-text" class="text-[28px] font-bold tracking-tight text-white mb-0 leading-none">0.0</span>
                    <span class="unit-label text-[10px] text-[#888] font-medium">Mb/s</span>
                </div>
            </div>
            
            <div class="w-[1px] bg-white/10 my-2"></div>
            
            <div class="flex-1 pl-1">
                <p class="text-[11px] text-[#888] font-medium mb-1 flex items-center gap-1.5">
                    <svg class="w-3 h-3 text-purple-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M20 12v-8a2 2 0 0 0-2-2h-12a2 2 0 0 0-2 2v8M8 18l4 4 4-4M12 22v-13"/></svg>
                    Upload
                </p>
                <div class="flex items-baseline gap-1 mt-1">
                    <span id="ul-text" class="text-[28px] font-bold tracking-tight text-white mb-0 leading-none">0.0</span>
                    <span class="unit-label text-[10px] text-[#888] font-medium">Mb/s</span>
                </div>
            </div>
        </div>

        <!-- Graph canvas -->
        <div class="flex-1 w-full bg-[#0a0a0a] rounded-xl border border-white/5 relative p-0 overflow-hidden shadow-inner">
            <canvas id="speed-chart" class="w-full h-full relative z-10"></canvas>
        </div>

        <!-- Footer Stats -->
        <div class="mt-5 flex items-center justify-between text-[10px] text-[#666] font-medium px-1">
             <div class="flex items-center gap-1.5">
                 <svg class="w-3 h-3 text-[#555]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></svg>
                 <span id="ping-text">0 ms</span>
             </div>
             <div class="flex items-center gap-1.5">
                 <svg class="w-3 h-3 text-[#555]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
                 <span id="uptime">00:00:00</span>
             </div>
        </div>
    </div>

    <!-- Detailed Hardware-style Edge Handle -->
    <div id="sidebar-handle" class="w-[12px] h-[100px] bg-[#18181b] hover:bg-[#27272a] border border-white/10 border-r-0 rounded-l cursor-pointer shadow-[-4px_0_15px_rgba(0,0,0,0.6)] flex flex-col justify-center items-center gap-2 transition-colors flex-shrink-0 z-50">
        <!-- Tech Grip and LED styling -->
        <div class="w-0.5 h-1.5 bg-white/20 rounded"></div>
        <div class="w-0.5 h-1.5 bg-white/20 rounded"></div>
        <!-- Active LED -->
        <div class="w-0.5 h-4 bg-emerald-400 rounded shadow-[0_0_8px_#34d399]"></div>
        <div class="w-0.5 h-1.5 bg-white/20 rounded"></div>
        <div class="w-0.5 h-1.5 bg-white/20 rounded"></div>
    </div>
    
  </div>
  <script src="ui.js"></script>
</body>
</html>
