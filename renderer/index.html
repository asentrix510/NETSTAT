<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>NETSTAT Precision</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800;900&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="styles.css">
</head>
<body class="bg-transparent m-0 p-0 overflow-hidden text-white font-[Inter] w-[100vw] h-[100vh] select-none flex items-center justify-end">
  
  <div class="flex flex-row items-center justify-end pr-[2px]">
    <!-- Popout Glassmorphic Dashboard -->
    <!-- Display none -> Display flex dynamically via JS -->
    <div id="dashboard" class="hidden w-[308px] h-[350px] mr-1 bg-[#101014]/90 backdrop-blur-2xl border border-white/5 rounded-2xl shadow-[-15px_0_40px_rgba(0,0,0,0.9)] flex-col p-5 transition-opacity duration-200">
        <!-- Brand Header -->
        <div class="flex items-center justify-between mb-4 border-b border-white/5 pb-3">
             <div class="flex flex-col gap-0.5">
                 <h1 class="text-[11px] tracking-widest text-[#00f0ff] uppercase font-black drop-shadow-[0_0_8px_rgba(0,240,255,0.4)]">NETSTAT</h1>
                 <p class="text-[9px] text-gray-500 uppercase tracking-widest font-bold">Live Telemetry</p>
             </div>
             <button id="close-btn" class="w-7 h-7 rounded-lg bg-white/5 hover:bg-[#ff003c]/20 hover:text-[#ff003c] hover:border-[#ff003c]/50 transition-all flex items-center justify-center text-white/40 border border-white/5 cursor-pointer">
                 <span class="material-symbols-outlined text-[16px]">power_settings_new</span>
             </button>
        </div>

        <!-- Metric Grid -->
        <div class="flex flex-row gap-3 mb-4">
            <!-- Down -->
            <div class="flex-1 bg-gradient-to-br from-white/5 to-transparent rounded-xl p-3 border border-white/5 relative overflow-hidden group">
                <div class="absolute inset-0 bg-gradient-to-b from-[#00f0ff]/10 to-transparent opacity-40"></div>
                <!-- Mini Grid Overlay -->
                <div class="absolute inset-0 z-0 opacity-10 pointer-events-none" style="background-image: radial-gradient(circle, #fff 1px, transparent 1px); background-size: 8px 8px;"></div>
                <div class="relative z-10 text-[9px] font-bold text-white/50 uppercase tracking-widest mb-1.5 flex items-center gap-1.5">
                    <span class="w-1.5 h-1.5 rounded-full bg-[#00f0ff] shadow-[0_0_8px_#00f0ff]"></span> Download
                </div>
                <div class="relative z-10 font-black tracking-tighter text-white drop-shadow-md flex items-baseline">
                    <span id="dl-text" class="text-[26px] leading-tight">0.0</span>
                    <span class="text-[11px] text-[#00f0ff]/70 ml-1 font-bold">Mb/s</span>
                </div>
            </div>
            <!-- Up -->
            <div class="flex-1 bg-gradient-to-br from-white/5 to-transparent rounded-xl p-3 border border-white/5 relative overflow-hidden group">
                <div class="absolute inset-0 bg-gradient-to-b from-[#ff003c]/10 to-transparent opacity-40"></div>
                <div class="absolute inset-0 z-0 opacity-10 pointer-events-none" style="background-image: radial-gradient(circle, #fff 1px, transparent 1px); background-size: 8px 8px;"></div>
                <div class="relative z-10 text-[9px] font-bold text-white/50 uppercase tracking-widest mb-1.5 flex items-center gap-1.5">
                    <span class="w-1.5 h-1.5 rounded-full bg-[#ff003c] shadow-[0_0_8px_#ff003c]"></span> Upload
                </div>
                <div class="relative z-10 font-black tracking-tighter text-white drop-shadow-md flex items-baseline">
                    <span id="ul-text" class="text-[26px] leading-tight">0.0</span>
                    <span class="text-[11px] text-[#ff003c]/70 ml-1 font-bold">Mb/s</span>
                </div>
            </div>
        </div>

        <!-- Connection Meta Bar -->
        <div class="flex flex-row items-center justify-between bg-black/40 rounded-lg py-2 px-3 mb-4 shadow-inner border border-white/5 text-xs text-gray-300">
             <div class="flex items-center gap-1.5 opacity-90">
                 <span class="material-symbols-outlined text-[13px] text-[#00f0ff]">sensors</span>
                 <span class="font-bold font-mono" id="ping-text">0<span class="text-[9px] font-normal opacity-50 ml-0.5">ms</span></span>
             </div>
             <div class="w-[1px] h-3 bg-white/15"></div>
             <div class="opacity-90 flex items-center gap-1">
                 <span class="material-symbols-outlined text-[13px] text-[#ff003c]">router</span>
                 <span class="font-mono text-[#ff003c] text-[10px] font-bold uppercase tracking-wider" id="net-type">ETH</span>
             </div>
             <div class="w-[1px] h-3 bg-white/15"></div>
             <div class="text-white/40 flex items-center gap-1">
                 <span class="material-symbols-outlined text-[13px]">timer</span>
                 <span class="font-mono font-bold tracking-widest text-[9px] pt-px" id="uptime">00:00:00</span>
             </div>
        </div>

        <!-- Waveform Interface container -->
        <div class="flex-1 bg-black/70 rounded-xl overflow-hidden border border-white/5 relative p-2 shadow-inner">
            <canvas id="speed-chart" class="w-full h-full relative z-10"></canvas>
            
            <div class="absolute inset-0 z-0 opacity-10 pointer-events-none" style="background-image: linear-gradient(#444 1px, transparent 1px), linear-gradient(90deg, #444 1px, transparent 1px); background-size: 20px 20px;"></div>
            
            <!-- Blinking Status marker -->
            <div class="absolute top-2 right-2.5 z-20 flex items-center gap-1.5 opacity-60">
                <div class="w-1.5 h-1.5 bg-[#00f0ff] rounded-full animate-pulse shadow-[0_0_8px_#00f0ff]"></div>
                <span class="text-[8px] font-mono font-black text-[#00f0ff] uppercase tracking-widest" id="net-status">ONLINE</span>
            </div>
        </div>
    </div>

    <!-- The Minimal Edge Nub -->
    <div id="sidebar-handle" class="w-[10px] h-[100px] bg-[#1a1a20]/80 hover:bg-[#25252d] border border-white/10 border-r-0 rounded-l-md cursor-pointer flex flex-col justify-center items-center gap-2 backdrop-blur-md shadow-[-6px_0_15px_rgba(0,0,0,0.5)] transition-all flex-shrink-0 z-50 overflow-hidden relative group">
        <!-- Cyber Sweep Hover -->
        <div class="absolute inset-0 bg-gradient-to-t from-[#00f0ff]/0 via-[#00f0ff]/15 to-[#00f0ff]/0 opacity-0 group-hover:opacity-100 transition-opacity"></div>
        
        <!-- Grip Lines -->
        <div class="w-[3px] h-1.5 bg-white/20 rounded-full transition-all group-hover:bg-white/60"></div>
        <div class="w-[3px] h-3 bg-white/30 rounded-full transition-all group-hover:bg-white/80"></div>
        <div class="w-[3px] h-4 bg-[#00f0ff] rounded-full shadow-[0_0_8px_#00f0ff]"></div>
        <div class="w-[3px] h-3 bg-white/30 rounded-full transition-all group-hover:bg-white/80"></div>
        <div class="w-[3px] h-1.5 bg-white/20 rounded-full transition-all group-hover:bg-white/60"></div>
    </div>
    
  </div>

  <script src="ui.js"></script>
</body>
</html>
